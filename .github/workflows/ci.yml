# Terraform CI - runs on every PR and on main. NEVER applies.
#
#   Terraform Validate  fmt / validate / terraform test (mocked plan) / tflint
#                       no AWS credentials needed
#   Terraform Plan      real plan against AWS through OIDC (read-only role);
#                       SKIPPED automatically until the repository variables
#                       below exist (no AWS account is connected yet)
#   (trivy + gitleaks live in security.yml)
#
# PUBLIC REPOSITORY: logs, step summaries and artifacts are world-readable.
# The full plan is written to a file and never printed; only counts and resource
# addresses are published. Review the full plan locally (scripts/plan.ps1).
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION, TF_STATE_BUCKET, AWS_PLAN_ROLE_ARN, TF_PERMISSIONS_BOUNDARY_ARN,
#   TF_ALLOWED_INGRESS_CIDRS  (JSON list, e.g. ["203.0.113.10/32"])
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Provider binaries only (keyed on the lock files); never state or plans.
      - name: Provider cache
        uses: actions/cache@v6
        with:
          path: .terraform-plugin-cache
          key: terraform-providers-${{ hashFiles('**/.terraform.lock.hcl') }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: validate + offline tests (bootstrap)
        working-directory: bootstrap
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: validate + offline tests (dev)
        working-directory: environments/dev
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: tflint
        run: |
          for root in bootstrap environments/dev; do
            docker run --rm -e GITHUB_TOKEN -v "$PWD:/ws" -w "/ws/$root" --entrypoint sh \
              ghcr.io/terraform-linters/tflint:v0.64.0 \
              -c 'tflint --init --config /ws/.tflint.hcl >/dev/null && tflint --config /ws/.tflint.hcl --format compact'
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}


  plan:
    name: Terraform Plan
    needs: static
    if: vars.AWS_PLAN_ROLE_ARN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: environments/dev
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_allowed_ingress_cidrs: ${{ vars.TF_ALLOWED_INGRESS_CIDRS }}
      TF_VAR_permissions_boundary_arn: ${{ vars.TF_PERMISSIONS_BOUNDARY_ARN }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-ci-plan-${{ github.run_id }}

      - name: terraform init (S3 backend, native locking)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan -detailed-exitcode
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=120s -detailed-exitcode -no-color -out=ci.tfplan > plan.log 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            # Errors only (no resource values): last lines of the log.
            grep -E "^(Error|│)" plan.log | head -40
            exit 1
          fi

      - name: summarize plan (counts + addresses only)
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        run: |
          terraform show -json ci.tfplan > plan.json
          jq -r '
            [.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"])] as $c |
            "add=\([$c[] | select(.change.actions | index("create"))] | length)",
            "change=\([$c[] | select(.change.actions | index("update"))] | length)",
            "destroy=\([$c[] | select(.change.actions | index("delete"))] | length)"
          ' plan.json > counts.txt
          . ./counts.txt
          {
            echo "### terraform plan (dev)"
            echo ""
            echo "**Plan: ${add} to add, ${change} to change, ${destroy} to destroy**"
            echo ""
            if [ "$destroy" -gt 0 ]; then
              echo ":warning: **Destroy/replace - explain each one before merging:**"
              jq -r '.resource_changes[] | select(.change.actions | index("delete")) | "- `\(.address)` (\(.change.actions | join(",")))"' plan.json
              echo ""
            fi
            echo "<details><summary>Changed resource addresses</summary>"
            echo ""
            jq -r '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "- `\(.address)`: \(.change.actions | join(","))"' plan.json
            echo ""
            echo "</details>"
            echo ""
            echo "_Public repository: full plan intentionally not published. Run scripts/plan.ps1 locally to review values._"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$destroy" -gt 0 ]; then echo "::warning::Plan destroys ${destroy} resource(s)"; fi
          rm -f plan.json ci.tfplan plan.log

      - name: comment on PR
        if: github.event_name == 'pull_request' && (steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2')
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = '<!-- terraform-plan-dev -->\n' + fs.readFileSync('environments/dev/summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body.startsWith('<!-- terraform-plan-dev -->'));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
