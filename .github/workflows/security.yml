# Security - one job, one clear responsibility per tool (no overlap):
#
#   Secret scan      gitleaks   full git history, findings redacted
#   IaC              trivy      Terraform misconfigurations (SARIF -> Code Scanning)
#                               accepted risks: inline #trivy:ignore with a reason,
#                               listed in docs/security-scan.md
#   (tflint runs in ci.yml "Terraform Validate")
#
# Also runs weekly: new CVEs appear without any code change.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to Code Scanning
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # secret scan needs the whole history

      - name: Secret scan (gitleaks, full history, redacted)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1 -c \
            "git config --global --add safe.directory /repo && gitleaks git . --redact --no-banner --exit-code 1" \
            2>&1 | tee gitleaks.log
          # Guard against a silent pass: 0 commits scanned means gitleaks could not read the repo.
          grep -Eq "[1-9][0-9]* commits scanned" gitleaks.log

      - name: IaC scan (trivy config)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.74.0 config \
            --severity MEDIUM,HIGH,CRITICAL --skip-dirs '**/.terraform' --exit-code 1 /src

      - name: Trivy SARIF (all severities, for Code Scanning)
        if: always()
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.74.0 config \
            --skip-dirs '**/.terraform' --format sarif --output /src/trivy-config.sarif /src

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
